name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  static-analysis:
    name: Static Analysis & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "APP_LAYOUT=" >> local.properties
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY || '' }}" >> local.properties
          echo "SUBDL_API_KEY=${{ secrets.SUBDL_API_KEY || '' }}" >> local.properties
          echo "RABBITSTREAM_SOURCE_API=${{ secrets.RABBITSTREAM_SOURCE_API || '' }}" >> local.properties

      - name: Run Lint
        id: lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Run Unit Tests
        id: tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug --stacktrace

      - name: Check APK size
        run: |
          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/*.apk)
          echo "Debug APK size: $APK_SIZE bytes ($(($APK_SIZE / 1024 / 1024)) MB)"
          if [ $APK_SIZE -gt 104857600 ]; then
            echo "::warning::APK exceeds 100MB"
          fi

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## PR Check Results\n';
            comment += '| Check | Status |\n|-------|--------|\n';
            const lintStatus = '${{ steps.lint.outcome }}' === 'success' ? '✅' : '⚠️';
            const testStatus = '${{ steps.tests.outcome }}' === 'success' ? '✅' : '⚠️';
            const buildStatus = '${{ steps.build.outcome }}' === 'success' ? '✅' : '❌';
            comment += `| Lint | ${lintStatus} |\n`;
            comment += `| Unit Tests | ${testStatus} |\n`;
            comment += `| Build | ${buildStatus} |\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
