name: Build & Release APK

# Builds three signed APKs (same layout split as upstream Streamflix Reborn):
#   BetterStreamflix.apk            — universal (mobile + TV)
#   BetterStreamflix-only-Mobile.apk
#   BetterStreamflix-only-TV.apk
#
# Trigger: push tag v*              → GitHub Release with all three assets
#          push to main / dskja/**  → upload all three as artifacts (no release)
#          workflow_dispatch        → upload all three as artifacts (no release)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'dskja/**'

concurrency:
  group: apk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Access Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          touch local.properties
          if [ -n "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY=$TMDB_API_KEY" >> local.properties
          fi
          if [ -n "$RABBITSTREAM_SOURCE_API" ]; then
            echo "RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API" >> local.properties
          fi

      - name: Generate native-lib.cpp from template
        env:
          UPROT_API_BASE: ${{ secrets.UPROT_API_BASE }}
          UPROT_SIGN_KEY: ${{ secrets.UPROT_SIGN_KEY }}
          UPROT_DIRECT_API_BASE: ${{ secrets.UPROT_DIRECT_API_BASE }}
          UPROT_DIRECT_KEY: ${{ secrets.UPROT_DIRECT_KEY }}
        run: |
          if [ -n "$UPROT_DIRECT_KEY" ] || [ -n "$UPROT_API_BASE" ]; then
            sed -e "s|{{UPROT_API_BASE}}|$UPROT_API_BASE|g" \
                -e "s|{{UPROT_SIGN_KEY}}|$UPROT_SIGN_KEY|g" \
                -e "s|{{UPROT_DIRECT_API_BASE}}|$UPROT_DIRECT_API_BASE|g" \
                -e "s|{{UPROT_DIRECT_KEY}}|$UPROT_DIRECT_KEY|g" \
                app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ── Universal (no APP_LAYOUT) ──────────────────────────────────────────
      - name: Build universal APK
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: Sign universal APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename universal APK
        run: |
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" BetterStreamflix.apk
          rm -rf app/build/outputs/apk/release

      # ── Mobile-only ───────────────────────────────────────────────────────
      - name: Set Mobile layout
        run: |
          # Drop any previous APP_LAYOUT line, then set mobile
          grep -v '^APP_LAYOUT=' local.properties > local.properties.tmp || true
          mv local.properties.tmp local.properties
          echo "APP_LAYOUT=mobile" >> local.properties

      - name: Build mobile APK
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: Sign mobile APK
        id: sign_apk_mobile
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename mobile APK
        run: |
          cp "${{ steps.sign_apk_mobile.outputs.signedReleaseFile }}" BetterStreamflix-only-Mobile.apk
          rm -rf app/build/outputs/apk/release

      # ── TV-only ───────────────────────────────────────────────────────────
      - name: Set TV layout
        run: |
          grep -v '^APP_LAYOUT=' local.properties > local.properties.tmp || true
          mv local.properties.tmp local.properties
          echo "APP_LAYOUT=tv" >> local.properties

      - name: Build TV APK
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: Sign TV APK
        id: sign_apk_tv
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename TV APK
        run: |
          cp "${{ steps.sign_apk_tv.outputs.signedReleaseFile }}" BetterStreamflix-only-TV.apk
          rm -rf app/build/outputs/apk/release

      # Artifacts for manual runs and every non-tag commit (no GitHub Release).
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: BetterStreamflix-apks-${{ github.sha }}
          path: |
            BetterStreamflix.apk
            BetterStreamflix-only-Mobile.apk
            BetterStreamflix-only-TV.apk
          if-no-files-found: error
          retention-days: 14

      - name: Extract changelog for this version
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { p=1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q . release-notes.md; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          echo "Extracted release notes for $VERSION:"
          cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BetterStreamflix ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            BetterStreamflix.apk
            BetterStreamflix-only-Mobile.apk
            BetterStreamflix-only-TV.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
