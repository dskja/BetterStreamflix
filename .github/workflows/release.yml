name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Access Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          echo TMDB_API_KEY=$TMDB_API_KEY >> local.properties
          echo SUBDL_API_KEY=$SUBDL_API_KEY >> local.properties
          echo RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API >> local.properties

      - name: Generate native-lib.cpp from template
        env:
          UPROT_MSFI_API_BASE: ${{ secrets.UPROT_MSFI_API_BASE }}
          UPROT_MSE_API_BASE: ${{ secrets.UPROT_MSE_API_BASE }}
          UPROT_API_KEY: ${{ secrets.UPROT_API_KEY }}
        run: |
          sed -e "s|{{UPROT_MSFI_API_BASE}}|$UPROT_MSFI_API_BASE|g" \
              -e "s|{{UPROT_MSE_API_BASE}}|$UPROT_MSE_API_BASE|g" \
              -e "s|{{UPROT_API_KEY}}|$UPROT_API_KEY|g" \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ─── Default (mobile+TV) APK ───
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        id: sign_apk
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Pick APK path (default)
        id: apk_default
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-unsigned-signed.apk" ]; then
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned-signed.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          fi

      - name: Copy default APK to staging
        run: |
          cp "${{ steps.apk_default.outputs.apk_path }}" "/tmp/BetterStreamflix-${{ github.ref_name }}.apk"

      # ─── Mobile-only APK ───
      - name: Set Mobile version
        run: |
          echo APP_LAYOUT=mobile >> local.properties

      - name: Build APK (mobile)
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK (mobile)
        id: sign_apk_mobile
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Pick APK path (mobile)
        id: apk_mobile
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-unsigned-signed.apk" ]; then
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned-signed.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          fi

      - name: Copy mobile APK to staging
        run: |
          cp "${{ steps.apk_mobile.outputs.apk_path }}" "/tmp/BetterStreamflix-${{ github.ref_name }}-only-mobile.apk"

      # ─── TV-only APK ───
      - name: Set TV version
        run: |
          echo APP_LAYOUT=tv >> local.properties

      - name: Build APK (tv)
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK (tv)
        id: sign_apk_tv
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Pick APK path (tv)
        id: apk_tv
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-unsigned-signed.apk" ]; then
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned-signed.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          fi

      - name: Copy TV APK to staging
        run: |
          cp "${{ steps.apk_tv.outputs.apk_path }}" "/tmp/BetterStreamflix-${{ github.ref_name }}-only-tv.apk"

      - name: Create Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: BetterStreamflix ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            /tmp/BetterStreamflix-${{ github.ref_name }}.apk
            /tmp/BetterStreamflix-${{ github.ref_name }}-only-mobile.apk
            /tmp/BetterStreamflix-${{ github.ref_name }}-only-tv.apk
