name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Access Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          touch local.properties
          if [ -n "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY=$TMDB_API_KEY" >> local.properties
          fi
          if [ -n "$RABBITSTREAM_SOURCE_API" ]; then
            echo "RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API" >> local.properties
          fi

      - name: Generate native-lib.cpp from template
        env:
          UPROT_API_BASE: ${{ secrets.UPROT_API_BASE }}
          UPROT_SIGN_KEY: ${{ secrets.UPROT_SIGN_KEY }}
          UPROT_DIRECT_API_BASE: ${{ secrets.UPROT_DIRECT_API_BASE }}
          UPROT_DIRECT_KEY: ${{ secrets.UPROT_DIRECT_KEY }}
        run: |
          if [ -n "$UPROT_DIRECT_KEY" ] || [ -n "$UPROT_API_BASE" ]; then
            sed -e "s|{{UPROT_API_BASE}}|$UPROT_API_BASE|g" \
                -e "s|{{UPROT_SIGN_KEY}}|$UPROT_SIGN_KEY|g" \
                -e "s|{{UPROT_DIRECT_API_BASE}}|$UPROT_DIRECT_API_BASE|g" \
                -e "s|{{UPROT_DIRECT_KEY}}|$UPROT_DIRECT_KEY|g" \
                app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename signed APK
        id: apk
        run: |
          SRC="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          DEST="BetterStreamflix-${{ github.ref_name }}.apk"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            DEST="BetterStreamflix-build.apk"
          fi
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BetterStreamflix-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BetterStreamflix ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
