plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

android {
    namespace 'com.betterstreamflix'
    compileSdk 36
    ndkVersion "26.1.10909125"

    def properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())

    defaultConfig {
        applicationId "com.betterstreamflix"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "2.0.0"

        buildConfigField "String", "APP_LAYOUT", "\"${properties.getProperty("APP_LAYOUT")}\""
        buildConfigField "String", "TMDB_API_KEY", "\"${properties.getProperty("TMDB_API_KEY")}\""
        buildConfigField "String", "SUBDL_API_KEY", "\"${properties.getProperty("SUBDL_API_KEY")}\""
        buildConfigField "String", "RABBITSTREAM_SOURCE_API", "\"${properties.getProperty("RABBITSTREAM_SOURCE_API")}\""

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    sourceSets {
        main {
            def appLayout = properties.getProperty("APP_LAYOUT") ?: "mobile"
            def sharedManifest = file("${project.rootDir}/app/src/main/AndroidManifest.xml")
            def layoutManifest = file("${project.rootDir}/app/src/main/${appLayout}/AndroidManifest.xml")
            def mergedManifest = file("${buildDir}/generated/manifest/AndroidManifest.xml")

            def mergeTask = tasks.register("merge${appLayout.capitalize()}Manifest") {
                inputs.files(sharedManifest, layoutManifest)
                outputs.file(mergedManifest)
                doLast {
                    mergedManifest.parentFile.mkdirs()
                    def parser = new XmlParser(false, false)
                    def shared = parser.parse(sharedManifest)
                    def layout = parser.parse(layoutManifest)
                    if (layout.application && shared.application) {
                        layout.application[0].children().each { child ->
                            shared.application[0].append(child)
                        }
                    }
                    def writer = new PrintWriter(mergedManifest, 'UTF-8')
                    writer.write('<?xml version="1.0" encoding="utf-8"?>\n')
                    new XmlNodePrinter(writer).print(shared)
                    writer.close()
                }
            }

            preBuild.dependsOn(mergeTask)
            manifest.srcFile mergedManifest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH")
            if (keystorePath != null && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH")
            if (keystorePath != null && file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lint {
        abortOnError false
        warningsAsErrors false
        checkReleaseBuilds false
        lintConfig file('lint.xml')
        baseline file('lint-baseline.xml')
    }
}

