publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  google_fonts: ^6.3.1
  cached_network_image: ^3.4.1
  http: ^1.5.0
  collection: ^1.19.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  video_player: ^2.10.0
  chewie: ^1.12.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
