name: BetterStreamflix
options:
  bundleIdPrefix: com.dskja
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.2
targets:
  BetterStreamflix:
    type: application
    platform: iOS
    sources:
      - path: BetterStreamflix
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dskja.betterstreamflix
        PRODUCT_NAME: BetterStreamflix
        INFOPLIST_FILE: BetterStreamflix/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SwiftSoup
schemes:
  BetterStreamflix:
    build:
      targets:
        BetterStreamflix: all
    run:
      config: Debug
    archive:
      config: Release
